[project]
name = "irk"
version = "0.1.0"
description = "A tiny IRC client that sits in channels and prints the links you care about."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Train", email = "adam@adametrain.com" }
]
requires-python = ">=3.14"
keywords = ["irc", "links", "cli", "sasl", "asyncio"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat :: Internet Relay Chat",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adamtrain/irk"
Repository = "https://github.com/adamtrain/irk"
Issues = "https://github.com/adamtrain/irk/issues"

[project.scripts]
irk = "irk.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "trustme>=1.2.1",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
